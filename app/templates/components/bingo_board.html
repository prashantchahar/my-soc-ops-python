<div class="relative" style="padding: 1.5rem;">
    <!-- Ornate border frame -->
    <div class="absolute inset-0" style="border: 3px dashed var(--accent-gold); border-radius: 0.75rem; pointer-events: none; animation: fadeInScale 0.8s ease-out;"></div>
    
    <!-- Corner flourishes -->
    <div class="absolute" style="top: 0.5rem; left: 0.5rem; font-size: 1.5rem; opacity: 0.8;">◆</div>
    <div class="absolute" style="top: 0.5rem; right: 0.5rem; font-size: 1.5rem; opacity: 0.8;">✦</div>
    <div class="absolute" style="bottom: 0.5rem; left: 0.5rem; font-size: 1.5rem; opacity: 0.8;">◈</div>
    <div class="absolute" style="bottom: 0.5rem; right: 0.5rem; font-size: 1.5rem; opacity: 0.8;">✦</div>

    <div class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square relative z-10">
        {% for square in session.board %}
        {% set is_winning = square.id in session.winning_square_ids %}
        {% set is_free = square.is_free_space %}
        <button
            {% if not is_free %}
            hx-post="/toggle/{{ square.id }}"
            hx-target="#game-container"
            hx-swap="outerHTML"
            {% endif %}
            {% if is_free %}disabled{% endif %}
            class="relative flex items-center justify-center p-1 text-center rounded transition-all duration-200 select-none min-h-[60px] text-xs leading-tight font-bold"
            style="
            {% if square.is_marked %}
                {% if is_winning %}
                background: linear-gradient(135deg, var(--accent-gold), var(--accent-saffron));
                box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
                color: var(--text-dark);
                border: 2px solid var(--accent-gold);
                animation: sparkle-pulse 1.5s ease-in-out infinite, staggered-scale-up 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                {% else %}
                background: linear-gradient(135deg, var(--primary-magenta), var(--accent-teal));
                box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
                color: var(--text-light);
                border: 2px solid var(--primary-magenta);
                animation: staggered-scale-up 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                {% endif %}
            {% else %}
                background: rgba(255, 255, 255, 0.1);
                color: var(--text-light);
                border: 2px solid var(--accent-gold);
                animation: staggered-scale-up 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                cursor: pointer;
            {% endif %}
            {%- if is_free %} font-bold font-serif; font-size: 1.125rem; background: linear-gradient(135deg, var(--accent-orange), var(--accent-saffron)) !important; color: var(--text-dark) !important; cursor: default; border: 2px solid var(--accent-saffron) !important;{% endif %}
            animation-delay: calc(var(--index) * 50ms);
            "
            aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
            aria-label="{{ 'Free space' if is_free else square.text }}"
            {% set index = loop.index0 %}
            style="--index: {{ index }};{% if square.is_marked %}
                {% if is_winning %}
                background: linear-gradient(135deg, var(--accent-gold), var(--accent-saffron));
                box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
                color: var(--text-dark);
                border: 2px solid var(--accent-gold);
                animation: sparkle-pulse 1.5s ease-in-out infinite, staggered-scale-up 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                {% else %}
                background: linear-gradient(135deg, var(--primary-magenta), var(--accent-teal));
                box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
                color: var(--text-light);
                border: 2px solid var(--primary-magenta);
                animation: staggered-scale-up 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                {% endif %}
            {% else %}
                background: rgba(255, 255, 255, 0.1);
                color: var(--text-light);
                border: 2px solid var(--accent-gold);
                animation: staggered-scale-up 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
                cursor: pointer;
            {% endif %}
            {%- if is_free %} font-bold; font-size: 1.125rem; background: linear-gradient(135deg, var(--accent-orange), var(--accent-saffron)) !important; color: var(--text-dark) !important; cursor: default; border: 2px solid var(--accent-saffron) !important;{% endif %}
            animation-delay: calc(var(--index) * 50ms);
            ">
            <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
            {% if square.is_marked and not is_free %}
            <span class="absolute top-0.5 right-0.5 text-xl" style="animation: fadeInScale 0.4s ease-out;">✦</span>
            {% endif %}
        </button>
        {% endfor %}
    </div>
</div>
