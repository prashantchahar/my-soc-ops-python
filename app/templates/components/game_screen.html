<div id="game-container">
<div class="flex flex-col min-h-full" style="background: linear-gradient(180deg, #2D1B4E 0%, #1F2937 50%, #111827 100%);">
    <!-- Header with ornate styling -->
    <header class="ornate-top-border" style="background: linear-gradient(90deg, var(--primary-magenta-dark), var(--primary-magenta), var(--accent-saffron)); padding: 1rem;">
        <div class="flex items-center justify-between">
            <button
                hx-post="/reset"
                hx-target="#game-container"
                hx-swap="outerHTML"
                class="text-white text-sm px-3 py-1.5 rounded font-bold" 
                style="background: rgba(255, 255, 255, 0.2); transition: all 0.3s;">
                ← BACK
            </button>
            <h1 class="serif-display text-3xl" style="color: var(--text-light); text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">🎬 BINGO 🎬</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <!-- Instructions -->
    <p class="text-center text-white text-sm py-3 px-4 italic" style="font-family: 'Playfair Display', serif; letter-spacing: 0.05em;">
        Tap a square when you find someone who matches it.
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="text-center py-2 font-bold text-sm" style="background: linear-gradient(90deg, var(--accent-gold), var(--accent-saffron)); color: var(--text-dark); animation: pulse 1s ease-in-out infinite;">
        🎉 BINGO! You got a line! 🎉
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
